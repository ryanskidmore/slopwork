name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs are always dry-runs. Only a pushed v* tag can reach the
  # real publish step below.
  workflow_dispatch:

# npm trusted publishing (OIDC) requires an id-token; everything else only
# needs to read the checked-out source. No npm secret token is stored in this
# repo — npm authenticates via the OIDC token this permission lets the job
# mint, matched against the trusted publisher configured on npmjs.com for
# this repo + workflow file.
permissions:
  contents: read
  id-token: write

# Never cancel an in-flight release (a half-finished publish is worse than a
# slow one) — just serialize releases on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: gate, build, publish
    runs-on: ubuntu-latest
    # contents: write is needed only by the final create-github-release step;
    # id-token must be re-declared because a job-level permissions block
    # replaces the workflow-level one entirely.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # test:browser (Playwright) needs a real Chromium; installed once here
      # rather than folded into check:required, since it's an OS-level
      # browser download/apt-deps step, not a `bun run` script concern.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Identical to CI: includes the frontend/browser suites, coverage
      # thresholds, compiled-binary smoke, and installation/execution of the
      # exact npm tarball.
      - name: Run required gate
        run: bun run check:required

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          PKG_VERSION="v$(bun -e 'console.log(require("./package.json").version)')"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "tag $TAG_VERSION matches package.json version $PKG_VERSION"

      # Only used to point npm at the right registry; no auth token is
      # configured here (or anywhere) — trusted publishing authenticates via
      # the OIDC id-token instead of a stored credential.
      - name: Set up Node.js for npm publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with the
      # setup-node Node 22 LTS install can be older than that.
      - name: Ensure npm supports trusted publishing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm install -g npm@^11.5.1

      - name: Confirm manual validation only
        if: github.event_name == 'workflow_dispatch'
        run: echo "manual dispatch completed the required gate; publishing is disabled"

      # Provenance is generated automatically under trusted publishing, so no
      # --provenance flag is needed (or wanted — npm treats it as implied).
      - name: Publish to npm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public

      # Keep the Releases page in lockstep with npm: publish a GitHub Release
      # for the tag, notes taken verbatim from this version's CHANGELOG
      # section (cut the changelog before tagging — see RELEASE.md). Runs
      # after the npm publish so a gate/publish failure never leaves a
      # release pointing at an unpublished version.
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '/^## /{if(found)exit; if($2==ver){found=1;next}} found' CHANGELOG.md > /tmp/release-notes.md
          if ! [ -s /tmp/release-notes.md ]; then
            echo "::error::no CHANGELOG section found for $VERSION — cut the changelog before tagging"
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md --verify-tag
