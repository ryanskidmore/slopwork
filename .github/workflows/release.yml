name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the full gate and a publish dry-run without actually publishing to npm"
        type: boolean
        default: false

# npm trusted publishing (OIDC) requires an id-token; everything else only
# needs to read the checked-out source. No npm secret token is stored in this
# repo — npm authenticates via the OIDC token this permission lets the job
# mint, matched against the trusted publisher configured on npmjs.com for
# this repo + workflow file.
permissions:
  contents: read
  id-token: write

# Never cancel an in-flight release (a half-finished publish is worse than a
# slow one) — just serialize releases on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: gate, build, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Smoke test the compiled binary
        run: ./dist/slop --help

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          PKG_VERSION="v$(bun -e 'console.log(require("./package.json").version)')"
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "tag $TAG_VERSION matches package.json version $PKG_VERSION"

      # Only used to point npm at the right registry; no auth token is
      # configured here (or anywhere) — trusted publishing authenticates via
      # the OIDC id-token instead of a stored credential.
      - name: Set up Node.js for npm publish
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with the
      # setup-node Node 22 LTS install can be older than that.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish dry-run
        if: inputs.dry_run
        run: npm publish --dry-run --access public

      # Provenance is generated automatically under trusted publishing, so no
      # --provenance flag is needed (or wanted — npm treats it as implied).
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
