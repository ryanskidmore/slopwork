name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR so only the latest push is
# checked — saves CI minutes and gets feedback faster.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Keep this stable: branch protection may key its required check by name.
    name: install, lint, typecheck, test+coverage, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Caches the downloaded Bun executable itself (default on); this is
      # distinct from — and complementary to — the install-cache step below,
      # which caches downloaded packages. Not a duplicate of it.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One repository-owned gate is shared with release.yml, so release
      # cannot silently use weaker tests or a different package smoke test.
      - name: Run required gate
        run: bun run check:required
