name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR so only the latest push is
# checked — saves CI minutes and gets feedback faster.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Smoke test the compiled binary
        run: ./dist/slop --help

      - name: Verify npm package contents
        run: |
          set -euo pipefail
          npm pack --dry-run --json 2>/dev/null | bun -e '
            const data = JSON.parse(await Bun.stdin.text());
            const pkg = data[0];
            const paths = pkg.files.map((f) => f.path);

            if (pkg.name !== "slopwork") {
              console.error(`unexpected package name: ${pkg.name}`);
              process.exit(1);
            }

            const disallowed = paths.filter(
              (p) => p.startsWith("dist/") || p.includes("node_modules"),
            );
            if (disallowed.length > 0) {
              console.error(`disallowed paths in tarball: ${disallowed.join(", ")}`);
              process.exit(1);
            }

            const required = ["package.json", "README.md", "LICENSE", "bin/slop.mjs"];
            const missing = required.filter((r) => !paths.includes(r));
            if (missing.length > 0) {
              console.error(`missing required paths in tarball: ${missing.join(", ")}`);
              process.exit(1);
            }

            console.log(`OK: ${pkg.name}@${pkg.version} — ${paths.length} files, ${pkg.size} bytes packed`);
          '
